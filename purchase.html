<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shahaniya Supermarket — Purchase / ഓർഡർ</title>
<style>
    :root {
        --navy: #112233;
        --navy-deep: #0f2537;
        --gold: #d4af37;
        --gold-deep: #b8860b;
        --red: #d32f2f;
        --green: #4caf50;
        --teal: #0f5257;
        --paper: #f0f3f5;
    }
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0; padding: 20px 20px calc(150px + env(safe-area-inset-bottom, 0px));
        background-color: var(--paper);
        display: flex; justify-content: center;
    }
    .sheet {
        width: 100%; max-width: 650px;
        background: #ffffff;
        border: 4px solid var(--gold);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        overflow: hidden;
    }
    .header {
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
        color: #ffffff; text-align: center; padding: 28px 20px;
        border-bottom: 6px solid var(--gold);
        position: relative;
    }
    .back-link {
        position: absolute; left: 16px; top: 16px;
        color: #ffeb3b; text-decoration: none; font-size: 14px; font-weight: bold;
        background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;
    }
    .header h1 { margin: 6px 0 2px; font-size: 26px; letter-spacing: 1px; font-weight: bold; }
    .header h2 { margin: 4px 0 0; font-size: 19px; color: #ffeb3b; }
    .header p { margin: 8px 0 0; font-size: 13px; color: #cfd8dc; }

    .section-title {
        background: var(--teal); color: #ffffff;
        padding: 10px 20px; font-weight: bold; font-size: 16px;
        letter-spacing: 0.5px;
    }

    .item-row {
        display: flex; justify-content: space-between; align-items: center;
        gap: 12px;
        padding: 14px 18px; border-bottom: 1px solid #eeeff2;
    }
    .item-row:nth-child(even) { background: #fcfbfa; }
    .item-main { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
    .item-icon { font-size: 22px; min-width: 26px; text-align: center; }
    .item-text { display: flex; flex-direction: column; min-width: 0; }
    .item-name { font-weight: bold; font-size: 15.5px; color: #112233; line-height: 1.3; }
    .item-price-line { font-size: 13px; margin-top: 2px; }
    .mrp { text-decoration: line-through; color: var(--teal); margin-right: 8px; font-weight: bold; }
    .offer { color: var(--red); font-weight: bold; }

    .qty-block { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 118px; }
    .stepper { display: flex; align-items: center; border: 2px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .stepper button {
        background: var(--navy); color: #fff; border: none; width: 30px; height: 30px;
        font-size: 16px; font-weight: bold; cursor: pointer; line-height: 1;
    }
    .stepper button:active { background: var(--gold-deep); }
    .stepper .qty-display {
        width: 58px; text-align: center; font-weight: bold; font-size: 13px; color: var(--navy);
        background: #fff;
    }
    .line-total { font-size: 13px; font-weight: bold; color: var(--red); min-height: 16px; }

    .cart-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
        border-top: 4px solid var(--gold);
        padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex; justify-content: center;
        z-index: 50;
    }
    .cart-bar-inner {
        width: 100%; max-width: 650px;
        display: flex; align-items: center; justify-content: space-between; gap: 14px;
    }
    .cart-total-block { color: #ffffff; }
    .cart-total-block .label { font-size: 12px; color: #b0bec5; }
    .cart-total-block .amount { font-size: 24px; font-weight: bold; color: #ffeb3b; }
    .cart-total-block .savings { font-size: 12px; color: #8bc34a; font-weight: bold; }
    .send-btn {
        background: var(--green); color: #fff; border: none; border-radius: 8px;
        padding: 14px 20px; font-size: 15px; font-weight: bold; cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.25); white-space: nowrap;
    }
    .send-btn:disabled { background: #6b7c85; cursor: not-allowed; box-shadow: none; }
    .send-btn:not(:disabled):active { transform: scale(0.97); }

    .footer-note {
        background: var(--navy); color: #b0bec5; text-align: center;
        padding: 14px 20px 18px; font-size: 12px; border-top: 6px solid var(--gold);
    }
</style>
</head>
<body>

<div class="sheet">
    <div class="header">
        <a href="index.html" class="back-link">⟵ ഓഫർ ലിസ്റ്റ്</a>
        <h1>🛒 PURCHASE ORDER</h1>
        <h2>ഷഹാനിയ സൂപ്പർമാർക്കറ്റ്</h2>
        <p>ഓഫർ തിയ്യതി: 15 September 2026</p>
    </div>

    <div id="itemsHost"></div>

    <div class="footer-note">
        Proprietor: HABEEBULLA · KOPRAKANDAM, PURAKKAD · 📞 +91 8281 698973 | Powered by Mjaisal_qatar
    </div>
</div>

<div class="cart-bar">
    <div class="cart-bar-inner">
        <div class="cart-total-block">
            <div class="label">TOTAL AMOUNT</div>
            <div class="amount" id="grandTotal">₹0</div>
            <div class="savings" id="savingsLine"></div>
        </div>
        <button class="send-btn" id="sendBtn" disabled onclick="sendToCart()">💬 SEND TO CART</button>
    </div>
</div>

<script>
const UNIT_CONFIG = {
    kg:     { step: 1, min: 0, label: 'കിലോ',   format: v => v >= 1 ? v + ' കിലോ' : (v * 1000) + ' ഗ്രാം' },
    litre:  { step: 1, min: 0, label: 'ലിറ്റർ', format: v => v >= 1 ? v + ' ലിറ്റർ' : (v * 1000) + ' മി.ലി' },
    packet: { step: 1, min: 0, label: 'പാക്കറ്റ്', format: v => v + ' പാക്കറ്റ്' },
    piece:  { step: 1, min: 0, label: 'എണ്ണം',   format: v => v + ' എണ്ണം' }
};

const CATEGORIES = [
  { title: '🥬 പച്ചക്കറി & ദിനചര്യ സാമഗ്രികൾ / VEGETABLES & GROCERY', items: [
      { id:'onion',          icon:'🧅', name:'ഉള്ളി',                size:'(1 kg)',       mrp:65,  price:53,  unit:'kg' },
      { id:'potato',         icon:'🥔', name:'ഉരുളക്കിഴങ്ങ്',        size:'(1 kg)',       mrp:40,  price:20,  unit:'kg' },
      { id:'sugar',          icon:'🍬', name:'പഞ്ചസാര',              size:'',             mrp:70,  price:55,  unit:'kg' },
      { id:'egg',            icon:'🥚', name:'മുട്ട',                 size:'(10 എണ്ണം)',   mrp:75,  price:65,  unit:'piece' },
      { id:'green_peas',     icon:'🫛', name:'പച്ചപ്പട്ടാണി (Green Peas)', size:'', mrp:100, price:65, unit:'kg' },
      { id:'mango_pickle',   icon:'🥭', name:'മാങ്ങ അച്ചാർ',          size:'(500g)',       mrp:70,  price:50,  unit:'packet' },
      { id:'lemon_pickle',   icon:'🍋', name:'നാരങ്ങ അച്ചാർ',        size:'(500g)',       mrp:75,  price:55,  unit:'packet' }
  ]},
  { title: '🌾 പൊടികൾ, ധാന്യങ്ങൾ & റൈസ് / FLOURS, GRAINS & RICE', items: [
      { id:'kadala',         icon:'🧆', name:'കടല',                  size:'',             mrp:120, price:90,  unit:'kg' },
      { id:'cherupayar',     icon:'🟢', name:'ചെറുപയർ',              size:'',             mrp:140, price:110, unit:'kg' },
      { id:'ashirvad_atta',  icon:'🌾', name:'Ashirvad ആട്ട',        size:'',             mrp:75,  price:68,  unit:'packet' },
      { id:'vella_kadala',   icon:'🧆', name:'വെള്ള കടല',            size:'',             mrp:150, price:140, unit:'kg' },
      { id:'ozone_puttu',    icon:'🌾', name:'Ozone പുട്ടുപൊടി',     size:'(1 kg)',       mrp:75,  price:60,  unit:'packet' },
      { id:'pathiri_500g',   icon:'🌾', name:'പത്തിരിപ്പൊടി',        size:'(500g)',       mrp:46,  price:40,  unit:'packet' },
      { id:'pasta',          icon:'🍝', name:'പാസ്ത',                size:'(500g)',       mrp:140, price:70,  unit:'packet' },
      { id:'macaroni',       icon:'🍝', name:'മക്രോണി',              size:'(500g)',       mrp:45,  price:35,  unit:'packet' },
      { id:'kaima_rice',     icon:'🍚', name:'കൈമ അരി',              size:'(1 kg)',       mrp:160, price:130, unit:'kg' },
      { id:'kola_ari',       icon:'🌾', name:'കോല അരി',              size:'(1 kg)',       mrp:85,  price:80,  unit:'kg' },
      { id:'ozone_atta',     icon:'🌾', name:'Ozone ആട്ട',           size:'(1 kg)',       mrp:65,  price:50,  unit:'packet' },
      { id:'muttari_powder', icon:'🌾', name:'മൂത്താരി പൊടി',        size:'(500g)',       mrp:65,  price:50,  unit:'packet' },
      { id:'tea_powder',     icon:'☕', name:'ചായപ്പൊടി',             size:'(200g)',       mrp:90,  price:65,  unit:'packet' },
      { id:'chapathi_pack',  icon:'🫓', name:'ചപ്പാത്തി',             size:'(1 pack)',     mrp:60,  price:40,  unit:'packet' }
  ]},
  { title: '🛢️ എണ്ണ & പാചക എണ്ണകൾ / OILS', items: [
      { id:'smruthy_oil',    icon:'🥥', name:'സമൃദ്ധി വെളിച്ചെണ്ണ', size:'(1 ലിറ്റർ)',   mrp:290, price:250, unit:'litre' },
      { id:'cooking_oil',    icon:'🛢️', name:'ഓയിൽ',                 size:'',             mrp:165, price:155, unit:'litre' }
  ]},
  { title: '🧼 ക്ലീനിംഗ്, സോപ്പുകൾ & വ്യക്തിഗത സാമഗ്രികൾ / CLEANING & SOAPS', items: [
      { id:'rose_powder',    icon:'🧼', name:'Rose സോപ്പ് പൊടി',      size:'',             mrp:99,  price:90,  unit:'packet' },
      { id:'sunplus_powder', icon:'🧼', name:'Sunplus സോപ്പ് പൊടി',   size:'',             mrp:99,  price:90,  unit:'packet' },
      { id:'twash_powder',   icon:'🧺', name:'Twash സോപ്പ് പൊടി',    size:'(3.5 Kg)',     mrp:255, price:190, unit:'piece' },
      { id:'ziya_3pc',       icon:'🧼', name:'Ziya soap',           size:'(3 piece)',    mrp:60,  price:50,  unit:'packet' },
      { id:'exo_4pc',        icon:'🧼', name:'എക്സോ',               size:'(4 piece)',    mrp:40,  price:30,  unit:'packet' },
      { id:'dishwash_5l',    icon:'🧴', name:'ഡിഷ്‌വാഷ് ലിക്വിഡ്',   size:'(5 ലിറ്റർ)',   mrp:300, price:160, unit:'piece' },
      { id:'handwash_5kg',   icon:'🧴', name:'ഹാന്റ് വാഷ്',          size:'(5 Kg)',       mrp:250, price:160, unit:'piece' },
      { id:'wash_liquid_5kg',icon:'🧺', name:'വാഷിംഗ് ലിക്വിഡ്',      size:'(5 Kg)',       mrp:499, price:270, unit:'piece' },
      { id:'ujala_powder_5kg',icon:'🧼', name:'Ujala സോപ്പ് പൊടി',   size:'(5 Kg)',       mrp:460, price:395, unit:'piece' },
      { id:'dishwash_1l',    icon:'🧴', name:'ഡിഷ്‌വാഷ് ലിക്വിഡ്',   size:'(1 ലിറ്റർ)',   mrp:95,  price:50,  unit:'piece' },
      { id:'toothbrush_3pc', icon:'🪥', name:'ടൂത്ത് ബ്രഷ്',          size:'(3 piece)',    mrp:60,  price:50,  unit:'packet' },
      { id:'vival_4pc',      icon:'🧼', name:'Vival Soap',          size:'(4 piece)',    mrp:160, price:90,  unit:'packet' },
      { id:'phenoyl_1l',     icon:'🧴', name:'ഫിനൈൽ',               size:'(1 ലിറ്റർ)',   mrp:65,  price:50,  unit:'piece' }
  ]}
];

const state = {};

function buildUI() {
    const host = document.getElementById('itemsHost');
    let html = '';
    CATEGORIES.forEach(cat => {
        html += `<div class="section-title">${cat.title}</div>`;
        cat.items.forEach(item => {
            state[item.id] = 0;
            html += `
            <div class="item-row">
                <div class="item-main">
                    <span class="item-icon">${item.icon}</span>
                    <div class="item-text">
                        <span class="item-name">${item.name} ${item.size}</span>
                        <span class="item-price-line"><span class="mrp">MRP ${item.mrp}</span><span class="offer">₹${item.price}</span></span>
                    </div>
                </div>
                <div class="qty-block">
                    <div class="stepper">
                        <button onclick="changeQty('${item.id}', -1)">−</button>
                        <span class="qty-display" id="qty-${item.id}">0</span>
                        <button onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                    <div class="line-total" id="line-${item.id}"></div>
                </div>
            </div>`;
        });
    });
    host.innerHTML = html;
}

function getItemById(id) {
    for (const cat of CATEGORIES) {
        for (const it of cat.items) if (it.id === id) return it;
    }
    return null;
}

function changeQty(id, dir) {
    const item = getItemById(id);
    const cfg = UNIT_CONFIG[item.unit];
    let val = state[id] + dir * cfg.step;
    val = Math.max(cfg.min, Math.round(val * 100) / 100);
    state[id] = val;
    document.getElementById(`qty-${id}`).textContent = val === 0 ? '0' : cfg.format(val);
    const lineTotal = val * item.price;
    document.getElementById(`line-${id}`).textContent = lineTotal > 0 ? `₹${Math.round(lineTotal)}` : '';
    updateGrandTotal();
}

function updateGrandTotal() {
    let total = 0, mrpTotal = 0;
    CATEGORIES.forEach(cat => cat.items.forEach(item => {
        const qty = state[item.id];
        if (qty > 0) {
            total += qty * item.price;
            mrpTotal += qty * item.mrp;
        }
    }));
    total = Math.round(total);
    mrpTotal = Math.round(mrpTotal);
    document.getElementById('grandTotal').textContent = `₹${total}`;
    const savings = mrpTotal - total;
    document.getElementById('savingsLine').textContent = savings > 0 ? `You save ₹${savings}!` : '';
    document.getElementById('sendBtn').disabled = total === 0;
}

function sendToCart() {
    let lines = [];
    let total = 0;
    let i = 1;
    CATEGORIES.forEach(cat => cat.items.forEach(item => {
        const qty = state[item.id];
        if (qty > 0) {
            const cfg = UNIT_CONFIG[item.unit];
            const lineTotal = Math.round(qty * item.price);
            total += lineTotal;
            lines.push(`${i}. ${item.name} ${item.size} - ${cfg.format(qty)} - ₹${lineTotal}`);
            i++;
        }
    }));
    if (lines.length === 0) return;

    let message = `🛒 Hello Shahaniya Supermarket! I would like to place an order.

Here is my shopping list:
`;
    message += lines.join('\n');
    message += `\n\n💰 Total Amount: ₹${total}`;
    message += `\n\n📍 My Delivery/Pickup Details:\nName:\nLocation/Address:`;

    const encoded = encodeURIComponent(message);
    window.open(`https://wa.me/918281698973?text=${encoded}`, '_blank');
}

buildUI();
</script>

</body>
</html>
